[package]
resolver = "3"
# ── ★ MSRV IS ENFORCED, NOT DECORATIVE ──────────────────────────────────
# `rust-version` alone does NOTHING under resolver 2 (the edition-2021
# default): cargo ignores it when selecting dependency versions. Both lines
# are required, and resolver 3 is the half that binds.
#
# MEASURED 2026-08-05/06: `kstring@2.0.4` (requires rustc 1.96.0) entered
# codesearch's lockfile, and because codesearch is in every node's
# home-manager closure it stopped the ENTIRE fleet rebuilding — rio sat on a
# stale generation for six hours. It was pinned back with `cargo update
# --precise`, and the very next release regenerated the lock and REVERTED the
# pin. A lockfile pin cannot survive its own release automation; a declaration
# constrains resolution instead of recording its result.
#
# CORRECTED 2026-08-06 — the sentence that used to sit here, "1.95.0 is the
# fleet toolchain", was WRONG WHEN WRITTEN and wrong by two minor versions. It
# was inherited from the incident write-up rather than measured. The fleet's
# `fenix` input is the literal string `stable` (substrate lib/build/rust/
# overlay.nix), so the compiler is whatever the locked fenix rev's channel says
# — today rev d17fa5c0, channel dated 2026-07-16, `rustc 1.97.1`, verified by
# executing the built toolchain, not by reading a lockfile.
#
# So this declaration was never the floor it claimed to be: it was a CEILING
# two minors BELOW the compiler. Under resolver 3 cargo refuses any crate whose
# rust-version exceeds the DECLARED one, so we were locked out of every 1.96+
# and 1.97+ crate while running a compiler that compiles them fine. The
# mitigation outlived the condition it mitigated.
#
# 1.97.0, not 1.97.1, deliberately: one patch of headroom means a fenix rev
# that lags by a patch cannot re-create the exact "dep needs more than our
# rustc" failure this block exists to prevent. The compiler floats with no gate
# — it moved 1.96.0 -> 1.97.0 -> 1.97.1 on routine `nix flake update` commits,
# unannounced, with no attributable breakage — so the declaration must tolerate
# it moving under us.
rust-version = "1.97.0"
name = "zoekt-mcp"
version = "0.1.8"
edition = "2021"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
description = "MCP server wrapping Zoekt trigram-indexed code search for Claude Code"
repository = "https://github.com/pleme-io/zoekt-mcp"
homepage = "https://github.com/pleme-io/zoekt-mcp"
keywords = ["mcp", "zoekt", "code-search", "claude", "trigram"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "zoekt-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rmcp = { version = "0.15", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Configuration prime directive — DaemonConfig + CtagsConfig +
# WebserverConfig impl shikumi::TieredConfig (bare/discovered/
# prescribed_default). Operators reach via ZOEKT_MCP_TIER env var.
shikumi = { version = "0.1", features = ["cli"] }
shellexpand = "3"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
